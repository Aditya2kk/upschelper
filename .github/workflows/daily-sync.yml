name: Daily Newspaper Sync

on:
  schedule:
    # Runs at 01:00 UTC (6:30 AM IST) every day
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync-newspapers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: telegram-service/package-lock.json

      - name: Install dependencies
        working-directory: telegram-service
        run: npm ci

      - name: Fetch newspapers from Telegram
        working-directory: telegram-service
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL || 'abvcdsdf' }}
          PDF_OUTPUT_DIR: ../frontend/public/newspapers
          FETCH_MESSAGE_LIMIT: 300
        run: node fetch-newspapers.mjs

      - name: Commit and push updated manifest & newspapers
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/newspapers/manifest.json
          if git diff --staged --quiet; then
            echo "No new newspapers found today."
          else
            git commit -m "chore(newspapers): automated daily newspaper sync [skip ci]"
            git push
          fi
